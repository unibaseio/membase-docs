$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Membase Docs
  structure:
    - type: space
      key: space-use
      title: Use Membase
      path: use
      default: true
      content:
        directory: ./src/content/docs/use
    - type: space
      key: space-connect
      title: Connect your AI
      path: connect
      content:
        directory: ./src/content/docs/connect
    - type: space
      key: space-build
      title: Build with Membase
      path: build
      content:
        directory: ./src/content/docs/build
    - type: space
      key: space-evaluation
      title: Evaluation
      path: evaluation
      content:
        directory: ./src/content/docs/evaluation
