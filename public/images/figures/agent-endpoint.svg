<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 340' width='960' height='340' role='img' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif"><defs><marker id='arr-s' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#8a94a3'/></marker><marker id='arr-b' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#3e61ff'/></marker><marker id='arr-g' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#12b886'/></marker><marker id='arr-d' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#d64545'/></marker></defs><rect width='960' height='340' fill='#ffffff'/><rect x='40' y='50' width='300' height='230' rx='10' fill='#fff' stroke='#e7eaef' stroke-width='1.2'/><rect x='40' y='50' width='4' height='230' rx='2' fill='#3e61ff'/><text x='60' y='78' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='11' font-weight='700' fill='#3e61ff' text-anchor='start'>THE SELLER'S ACCOUNT</text><rect x='60' y='92' width='260' height='150' rx='10' fill='#f6f7f9' stroke='#e7eaef' stroke-width='1.2'/><text x='76' y='116' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='15' font-weight='600' fill='#1a2035' text-anchor='start'>Support corpus</text><text x='76' y='136' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start'>a Memory: files, documents, what it learned</text><rect x='76' y='150' width='100' height='24' rx='12.0' fill='#f1edff' stroke='#f1edff' stroke-width='1.2'/><text x='126.0' y='166.32' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-w