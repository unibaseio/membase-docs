etica Neue', Arial, sans-serif" font-size='14' font-weight='600' fill='#1a2035' text-anchor='start'>alice, a subscriber</text><rect x='680' y='90' width='110' height='24' rx='12.0' fill='#e6f8f1' stroke='#e6f8f1' stroke-width='1.2'/><text x='735.0' y='106.32' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='500' fill='#12b886' text-anchor='middle'>own credential</text><text x='800' y='107' font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'>ask_agent → answer</text><text x='680' y='138' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='11' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>no documents, no writes, no other Memory</text><path d='M 600 165 C 630 165, 630 102, 658 102' fill='none' stroke='#12b886' stroke-width='1.6' marker-end='url(#arr-g)'/><rect x='660' y='175' width='260' height='105' rx='10' fill='#fff' stroke='#e7eaef' stroke-width='1.2'/><rect x='660' y='175' width='4' height='105' rx='2' fill='#12b886'/><text x='680' y='201' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='14' font-weight='600' fill='#1a2035' text-anchor='start'>bob, a subscriber</text><rect x='680' y='215' width='110' height='24' rx='12.0' fill='#e6f8f1' stroke='#e6f8f1' stroke-width='1.2'/><text x='735.0' y='231.32' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='500' fill='#12b886' text-anchor='middle'>own credential</text><text x='800' y='232' font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'>ask_agent → answer</text><text x='680' y='263' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='11' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>no documents, no writes, no other Memory</text><path d='M 600 165 C 630 165, 630 227, 658 227' fill='none' stroke='#12b886' stroke-width='1.6' marker-end='url(#arr-g)'/><text x='40' y='324' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>The buyer gets answers, never files. A lapsed or ended subscription stops on the very next call.</text></svg>
