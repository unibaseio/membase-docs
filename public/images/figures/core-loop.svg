mily="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>Small and standing.</text><rect x='290' y='112' width='130' height='24' rx='12.0' fill='#edf0ff' stroke='#bac4ff' stroke-width='1.2'/><text x='355.0' y='128.32' font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size='12' font-weight='500' fill='#3e61ff' text-anchor='middle'>search_memories</text><text x='290' y='160' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='400' fill='#3d4757' text-anchor='start'>passages, most relevant first,</text><text x='290' y='178' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='400' fill='#3d4757' text-anchor='start'>each naming its container</text><text x='290' y='214' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>A turn inside the memory.</text><rect x='520' y='112' width='90' height='24' rx='12.0' fill='#f6f7f9' stroke='#e7eaef' stroke-width='1.2'/><text x='565.0' y='128.32' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='500' fill='#3d4757' text-anchor='middle'>your model</text><text x='520' y='160' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='400' fill='#3d4757' text-anchor='start'>answers from the passages,</text><text x='520' y='178' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='400' fill='#3d4757' text-anchor='start'>citing container_name</text><text x='520' y='214' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>Say where it came from.</text><rect x='750' y='112' width='96' height='24' rx='12.0' fill='#e6f8f1' stroke='#e6f8f1' stroke-width='1.2'/><text x='798.0' y='128.32' font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size='12' font-weight='500' fill='#12b886' text-anchor='middle'>add_memory</text><rect x='852' y='112' width='60' height='24' rx='12.0' fill='#f6f7f9' stroke='#e7eaef' stroke-width='1.2'/><text x='882.0' y='128.32' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='500' fill='#5f6a7a' text-anchor='middle'>or a doc</text><text x='750' y='160' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='400' fill='#3d4757' text-anchor='start'>what the person supplied,</text><text x='750' y='178' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='400' fill='#3d4757' text-anchor='start'>in their words</text><text x='750' y='214' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>Only when they meant to.</text><path d='M 830.0 240 L 830.0 270 L 370.0 270 L 370.0 246' fill='none' stroke='#12b886' stroke-width='1.6' stroke-dasharray='4 4' marker-end='url(#arr-g)'/><text x='600.0' y='288' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='500' fill='#5f6a7a' text-anchor='middle'>the next search finds it</text><text x='40' y='316' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>The same loop in every harness; only the model side changes. Never confirm a delete on the model's own initiative.</text></svg>
