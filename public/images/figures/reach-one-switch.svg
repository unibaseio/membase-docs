' rx='10' fill='#fff' stroke='#e7eaef' stroke-width='1.2'/><rect x='690' y='48' width='4' height='92' rx='2' fill='#12b886'/><text x='710' y='74' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='14' font-weight='600' fill='#1a2035' text-anchor='start'>on: in reach</text><text x='710' y='94' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start'>listed, searchable,</text><text x='710' y='110' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start'>answers arrive</text><rect x='690' y='160' width='230' height='92' rx='10' fill='#fff' stroke='#e7eaef' stroke-width='1.2'/><rect x='690' y='160' width='4' height='92' rx='2' fill='#d64545'/><text x='710' y='186' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='14' font-weight='600' fill='#1a2035' text-anchor='start'>off: not in reach</text><text x='710' y='206' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start'>403 · not listed;</text><text x='710' y='222' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start'>same as a Memory that does not exist</text><path d='M 622 130 C 655 130, 655 94, 688 94' fill='none' stroke='#12b886' stroke-width='1.6' marker-end='url(#arr-g)'/><path d='M 622 170 C 655 170, 655 206, 688 206' fill='none' stroke='#8a94a3' stroke-width='1.6' marker-end='url(#arr-s)'/><text x='40' y='284' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>Off wins over caches and open sessions: the very next call reads the switch.</text></svg>
