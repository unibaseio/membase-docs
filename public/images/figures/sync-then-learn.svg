<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 300' width='960' height='300' role='img' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif"><defs><marker id='arr-s' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#8a94a3'/></marker><marker id='arr-b' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#3e61ff'/></marker><marker id='arr-g' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#12b886'/></marker><marker id='arr-d' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#d64545'/></marker></defs><rect width='960' height='300' fill='#ffffff'/><rect x='40' y='60' width='270' height='176' rx='10' fill='#fff' stroke='#e7eaef' stroke-width='1.2'/><rect x='40' y='60' width='4' height='176' rx='2' fill='#e8912b'/><text x='60' y='90' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='700' fill='#e8912b' text-anchor='start'>1</text><text x='76' y='90' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='15' font-weight='600' fill='#1a2035' text-anchor='start'>Material arrives</text><rect x='355' y='60' width='270' height='176' rx='10' fill='#fff' stroke='#e7eaef' stroke-width='1.2'/><rect x='355' y='60' width='4' height='176' rx='2' fill='#3e61ff'/><text x='375' y='90' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='700' fill='#3e61ff' text-anchor='start'>2</text><text x='391' y='90' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='15' font-weight='600' fill='#1a2035' text-anchor='start'>The Memory learns</text><rect x='670' y='60' width='270' height='176' rx='10' fill='#fff' stroke='#e7eaef' stroke-width='1.2'/><rect x='670' y='60' width='4' height='176' rx='2' fill='#12b886'/><text x='690' y='90' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='700' fill='#12b886' text-anchor='start'>3</text><text x='706' y='90' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='15' font-weight='600' fill='#1a2035' text-anchor='start'>In memory</text><text x='60' y='118' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='400' fill='#3d4757' text-anchor='start'>Add a source, Sync now,</text><text x='60' y='136' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='400' fill='#3d4757' text-anchor='start'>an upload, a captured chat</text><rect x='60' y='160' width='110' height='24' rx='12.0' fill='#fdf1e2' stroke='#fdf1e2' stroke-width='1.2'/><text x='115.0' y='176.32' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='500' fill='#e8912b' text-anchor='middle'>source: synced</text><rect x='178' y='160' width='112' height='24' rx='12.0' fill='#f6f7f9' stroke='#e7eaef' stroke-width='1.2'/><text x='234.0' y='176.32' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='500' fill='#5f6a7a' text-anchor='middle'>not learned yet</text><text x='60' y='210' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>Answers do not change yet.</text><text x='375' y='118' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='400' fill='#3d4757' text-anchor='start'>One run reads what is new,</text><text x='375' y='136' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='400' fill='#3d4757' text-anchor='start'>under the instruction</text><rect x='375' y='160' width='90' height='24' rx='12.0' fill='#edf0ff' stroke='#edf0ff' stroke-width='1.2'/><text x='420.0' y='176.32' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='500' fill='#3e61ff' text-anchor='middle'>Running…</text><text x='375' y='210' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>Started by Update now, a schedule,</text><text x='375' y='226' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>or a request from code.</text><text x='690' y='118' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='400' fill='#3d4757' text-anchor='start'>Your memory shows it,</text><text x='690' y='136' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='13' font-weight='400' fill='#3d4757' text-anchor='start'>search and the assistant find it</text><rect x='690' y='160' width='130' height='24' rx='12.0' fill='#e6f8f1' stroke='#e6f8f1' stroke-width='1.2'/><text x='755.0' y='176.32' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='500' fill='#12b886' text-anchor='middle'>Updated 3h ago</text><rect x='828' y='160' width='70' height='24' rx='12.0' fill='#f6f7f9' stroke='#e7eaef' stroke-width='1.2'/><text x='863.0' y='176.32' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='500' fill='#3e61ff' text-anchor='middle'>Report</text><text x='690' y='210' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>Run failed: open the report, fix, run again.</text><path d='M 314 148.0 L 351 148.0' fill='none' stroke='#3e61ff' stroke-width='1.6' marker-end='url(#arr-b)'/><text x='332.5' y='138.0' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='500' fill='#5f6a7a' text-anchor='middle'>a run</text><path d='M 629 148.0 L 666 148.0' fill='none' stroke='#3e61ff' stroke-width='1.6' marker-end='url(#arr-b)'/><text x='647.5' y='138.0' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='500' fill='#5f6a7a' text-anchor='middle'>done</text><text x='40' y='284' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>A successful sync means material arrived; only a run teaches the Memory.</text></svg>
