rt'>its own first-party client</text><text x='40' y='290' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>No model set: memory stays, but no turn can run — reads answer 422 · capability_unavailable until AI Setup has one.</text></svg>
