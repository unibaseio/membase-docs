7f9' stroke='#e7eaef' stroke-width='1.2'/><text x='362' y='106' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='middle'>paste the MCP URL</text><text x='362' y='126' font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size='12' font-weight='400' fill='#1a2035' text-anchor='middle'>…/mcp-http</text><path d='M 456 110 L 492 110' fill='none' stroke='#3e61ff' stroke-width='1.6' marker-end='url(#arr-b)'/><rect x='496' y='76' width='224' height='72' rx='10' fill='#edf0ff' stroke='#bac4ff' stroke-width='1.2'/><text x='608' y='98' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='600' fill='#1a2035' text-anchor='middle'>Consent screen, in the browser</text><text x='608' y='116' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='middle'>☑ the Memories it may use</text><text x='608' y='134' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='middle'>☑ Profile access</text><text x='60' y='172' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>Read-only, always: list, search, and the profile when ticked. Cannot add, delete or forget.</text><rect x='40' y='210' width='700' height='150' rx='10' fill='#fff' stroke='#e7eaef' stroke-width='1.2'/><rect x='40' y='210' width='4' height='150' rx='2' fill='#12b886'/><text x='60' y='236' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='11' font-weight='700' fill='#12b886' text-anchor='start'>SKILL OR CODE WITH A DEVELOPER KEY</text><text x='60' y='266' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='14' font-weight='600' fill='#1a2035' text-anchor='start'>An AI that runs commands,</text><text x='60' y='284' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='14' font-weight='600' fill='#1a2035' text-anchor='start'>or your own code</text><text x='60' y='302' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start'>Claude Code, Codex, the SDK…</text><path d='M 232 280 L 268 280' fill='none' stroke='#12b886' stroke-width='1.6' marker-end='url(#arr-g)'/><rect x='272' y='246' width='224' height='72' rx='10' fill='#e6f8f1' stroke='#bfe9d8' stroke-width='1.2'/><text x='384' y='268' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='600' fill='#1a2035' text-anchor='middle'>Developer key, minted on Connect</text><text x='384' y='286' font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size='12' font-weight='400' fill='#3d4757' text-anchor='middle'>mbk_…  shown once</text><text x='384' y='304' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='middle'>level · reach · expiry</text><path d='M 500 280 L 536 280' fill='none' stroke='#12b886' stroke-width='1.6' marker-end='url(#arr-g)'/><rect x='540' y='246' width='180' height='72' rx='10' fill='#f6f7f9' stroke='#e7eaef' stroke-width='1.2'/><text x='630' y='268' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='middle'>Read</text><text x='630' y='286' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='middle'>Read &amp; write</text><text x='630' y='304' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='middle'>Full access (confirm=true)</text><text x='60' y='342' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>As wide as the key says. Delete and forget exist only at Full access, and only with confirmation.</text><rect x='770' y='40' width='150' height='320' rx='10' fill='#f6f7f9' stroke='#e7eaef' stroke-width='1.2'/><text x='845' y='70' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='14' font-weight='600' fill='#1a2035' text-anchor='middle'>Connect page</text><text x='845' y='90' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='11' font-weight='400' fill='#5f6a7a' text-anchor='middle'>the owner's, always</text><text x='786' y='128' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'>switch a Memory</text><text x='786' y='145' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'>on or off</text><text x='786' y='162' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'></text><text x='786' y='179' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'>Disconnect…</text><text x='786' y='196' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'>an app</text><text x='786' y='213' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'></text><text x='786' y='230' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'>Revoke…</text><text x='786' y='247' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'>a key</text><text x='786' y='264' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'></text><text x='786' y='281' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'>narrow a level</text><text x='786' y='298' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#3d4757' text-anchor='start'>or reach</text><rect x='786' y='318' width='118' height='24' rx='12.0' fill='#3e61ff' stroke='#3e61ff' stroke-width='1.2'/><text x='845.0' y='333.96' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='11' font-weight='600' fill='#fff' text-anchor='middle'>next call</text><path d='M 742 115 L 768 115' fill='none' stroke='#8a94a3' stroke-width='1.6' marker-end='url(#arr-s)'/><path d='M 742 285 L 768 285' fill='none' stroke='#8a94a3' stroke-width='1.6' marker-end='url(#arr-s)'/><text x='40' y='388' font-family="Inter, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size='12' font-weight='400' fill='#5f6a7a' text-anchor='start' font-style='italic'>Both credentials belong to the account owner and are changed on Connect; the change applies on the credential's next call.</text></svg>
